# Hybrid Compute Preset: Bare-Metal Baseline (Cloud Hypervisor) + BYOC Spot Burst (GCP & AWS).
#
# How routing works:
#   - `prefer_cheapest = true` with no `provider_weights` selects the first ready placement in order.
#   - Baseline jobs run with sub-second boot on your dedicated bare-metal Cloud Hypervisor host.
#   - When the bare-metal host saturates or backs off, parallel burst jobs automatically spill over
#     onto your GCP and/or AWS Spot placements with zero workflow YAML changes.
#
# Replace placeholder repository, project, account, image, subnet, and security group IDs before live use.

repository = "example-org/example-repo"

[server]
listen = "127.0.0.1:8080"
public_url = "https://open-ci.example.com"
database_path = "/var/lib/open-ci/open-ci.db"
tick_seconds = 1
request_timeout_seconds = 20
allow_insecure_loopback = false
cors_allowed_origins = []

[github]
api_url = "https://api.github.com"
oidc_issuer = "https://token.actions.githubusercontent.com"

[cloud_hypervisor]
binary = "/usr/local/bin/cloud-hypervisor"
state_dir = "/var/lib/open-ci/microvms"
kernel_path = "/var/lib/open-ci/images/vmlinux"
rootfs_image = "/var/lib/open-ci/images/ubuntu-24.04-rootfs.ext4"
kernel_cmdline = "console=ttyS0 root=/dev/vda rw rootfstype=ext4 rootflags=nobarrier,noblock_validity,noinit_itable quiet"
bridge_name = "open-ci-br0"
subnet_cidr = "10.200.0.0/16"
host_direct_io = false
virtio_blk_queues = 4
memory_hugepages = false
pin_physical_cpus = false
default_vcpus = 4
default_memory_mib = 16384
max_instances = 8

[gcp]
project = "your-gcp-project-id"
compute_url = "https://compute.googleapis.com/compute/v1"
# Public pre-baked runner image (open-ci v0.2.1, actions/runner v2.338.2); no Packer run needed.
image = "projects/open-ci-public-images/global/images/open-ci-ubuntu-2404-x64-v021-r2"
# Direct egress via ephemeral external IPv4 (no Cloud NAT fees or caps); the
# open-ci-runner tag's deny-all ingress firewall keeps zero inbound ports open.
external_ipv4 = true
network_tier = "PREMIUM"
network_tags = ["open-ci-runner"]

[aws]
account_id = "123456789012"

[cache]
listen = "0.0.0.0:8090"
public_url = "http://10.200.0.1:8090"
max_entry_bytes = 10737418240
signed_url_ttl_seconds = 900
hot_cache_bytes = 4294967296
index_path = "/var/lib/open-ci/cache/index.db"
upstream_results_url = "https://results-receiver.actions.githubusercontent.com"

[cache.auth]
repositories = [123456789]

[cache.storage]
type = "local"
path = "/var/lib/open-ci/cache/blobs"

[cache.retention]
max_total_bytes = 107374182400
max_unused_days = 7
sweep_interval_seconds = 300

[admission]
mode = "webhook"
max_run_seconds = 3600
fallback_on_rerun = true

[admission.capacity]
vcpu = 128
instances = 32
disk_gb = 1600

[admission.background]
vcpu = 4
instances = 1
disk_gb = 64

[admission.guardrails]
max_concurrent_runs = 12

[pools.linux-x64]
runner_label = "open-ci-linux-x64"
fallback_label = "ubuntu-24.04"
architecture = "x64"
vcpu = 4
disk_gb = 64
max_instances = 16
min_idle_instances = 1
creates_per_tick = 4
lifetime_seconds = 2400
idle_seconds = 180
job_poll_seconds = 5
cloud_discovery_seconds = 30
prefer_cheapest = true
transparent_cache = true

# Priority 1: Bare-metal Cloud Hypervisor baseline (sub-second microVM boot, 5.7 GHz single-core).
[[pools.linux-x64.placements]]
provider = "cloud_hypervisor"
region = "local"
zone = "local-a"
machine_type = "ch-4c-16g"
subnet = "open-ci-br0"
spot = false

# Priority 2: BYOC GCP Spot burst placement with local NVMe SSD.
[[pools.linux-x64.placements]]
provider = "gcp"
region = "us-central1"
zone = "us-central1-a"
machine_type = "c4d-standard-8-lssd"
subnet = "projects/your-gcp-project-id/regions/us-central1/subnetworks/open-ci-runners-us-central1"
image = "projects/open-ci-public-images/global/images/open-ci-ubuntu-2404-x64-v021-r2"
disk_type = "hyperdisk-balanced"
disk_interface = "NVME"
nic_type = "GVNIC"
local_ssd_count = 1
network_bandwidth_tier = "TIER_1"
# SMT off: 8 hardware threads -> 4 full physical cores exposed as 4 vCPUs.
threads_per_core = 1
spot = true

# Same-region zone failover: a us-central1-a Spot stockout backs off only that zone.
[[pools.linux-x64.placements]]
provider = "gcp"
region = "us-central1"
zone = "us-central1-b"
machine_type = "c4d-standard-8-lssd"
subnet = "projects/your-gcp-project-id/regions/us-central1/subnetworks/open-ci-runners-us-central1"
image = "projects/open-ci-public-images/global/images/open-ci-ubuntu-2404-x64-v021-r2"
disk_type = "hyperdisk-balanced"
disk_interface = "NVME"
nic_type = "GVNIC"
local_ssd_count = 1
network_bandwidth_tier = "TIER_1"
threads_per_core = 1
spot = true

# Same-region zone failover: a us-central1-b Spot stockout backs off only that zone.
[[pools.linux-x64.placements]]
provider = "gcp"
region = "us-central1"
zone = "us-central1-c"
machine_type = "c4d-standard-8-lssd"
subnet = "projects/your-gcp-project-id/regions/us-central1/subnetworks/open-ci-runners-us-central1"
image = "projects/open-ci-public-images/global/images/open-ci-ubuntu-2404-x64-v021-r2"
disk_type = "hyperdisk-balanced"
disk_interface = "NVME"
nic_type = "GVNIC"
local_ssd_count = 1
network_bandwidth_tier = "TIER_1"
threads_per_core = 1
spot = true

# Priority 3: BYOC AWS Spot burst placement with local NVMe SSD.
[[pools.linux-x64.placements]]
provider = "aws"
region = "us-east-1"
zone = "us-east-1a"
machine_type = "c7ad.xlarge"
subnet = "subnet-0123456789abcdef0"
image = "ami-0123456789abcdef0"
security_group = "sg-0123456789abcdef0"
root_device = "/dev/sda1"
spot = true

[pools.linux-arm64]
runner_label = "open-ci-linux-arm64"
fallback_label = "ubuntu-24.04-arm"
architecture = "arm64"
vcpu = 4
disk_gb = 40
max_instances = 8
min_idle_instances = 0
creates_per_tick = 4
lifetime_seconds = 2400
idle_seconds = 180
job_poll_seconds = 5
cloud_discovery_seconds = 30
prefer_cheapest = true
transparent_cache = true

[[pools.linux-arm64.placements]]
provider = "gcp"
region = "us-central1"
zone = "us-central1-a"
machine_type = "c4a-standard-4-lssd"
subnet = "projects/your-gcp-project-id/regions/us-central1/subnetworks/open-ci-runners-us-central1"
image = "projects/open-ci-public-images/global/images/open-ci-ubuntu-2404-arm64-v021-r2"
disk_type = "hyperdisk-balanced"
disk_interface = "NVME"
nic_type = "GVNIC"
local_ssd_count = 1
network_bandwidth_tier = "TIER_1"
spot = true

# Same-region zone failover: a us-central1-a Spot stockout backs off only that zone.
[[pools.linux-arm64.placements]]
provider = "gcp"
region = "us-central1"
zone = "us-central1-b"
machine_type = "c4a-standard-4-lssd"
subnet = "projects/your-gcp-project-id/regions/us-central1/subnetworks/open-ci-runners-us-central1"
image = "projects/open-ci-public-images/global/images/open-ci-ubuntu-2404-arm64-v021-r2"
disk_type = "hyperdisk-balanced"
disk_interface = "NVME"
nic_type = "GVNIC"
local_ssd_count = 1
network_bandwidth_tier = "TIER_1"
spot = true

# Same-region zone failover: a us-central1-b Spot stockout backs off only that zone.
[[pools.linux-arm64.placements]]
provider = "gcp"
region = "us-central1"
zone = "us-central1-c"
machine_type = "c4a-standard-4-lssd"
subnet = "projects/your-gcp-project-id/regions/us-central1/subnetworks/open-ci-runners-us-central1"
image = "projects/open-ci-public-images/global/images/open-ci-ubuntu-2404-arm64-v021-r2"
disk_type = "hyperdisk-balanced"
disk_interface = "NVME"
nic_type = "GVNIC"
local_ssd_count = 1
network_bandwidth_tier = "TIER_1"
spot = true

[[pools.linux-arm64.placements]]
provider = "aws"
region = "us-east-1"
zone = "us-east-1a"
machine_type = "c8gd.xlarge"
subnet = "subnet-0123456789abcdef0"
image = "ami-0fedcba9876543210"
security_group = "sg-0123456789abcdef0"
root_device = "/dev/sda1"
spot = true
