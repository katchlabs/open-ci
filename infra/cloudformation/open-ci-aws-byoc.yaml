AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  open-ci BYOC Runner Connection — creates a least-privilege cross-account IAM Role
  (with mandatory ExternalId, IMDSv2 enforcement, open-ci-managed tag scoping, and
  zero runner IAM instance profiles), an egress-only runner Security Group, and an
  optional regional S3 cache bucket. Zero control-plane infrastructure is created in your account.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: open-ci Control Plane Trust
        Parameters:
          - TrustedPrincipalArn
          - ExternalId
          - NamePrefix
      - Label:
          default: Runner Networking
        Parameters:
          - VpcId
          - SubnetIds
      - Label:
          default: Optional Direct BYOC Cache Bucket
        Parameters:
          - CreateCacheBucket
          - CacheRetentionDays

Parameters:
  TrustedPrincipalArn:
    Type: String
    AllowedPattern: "^arn:aws(-[a-z]+)?:iam::[0-9]{12}:role/.+$"
    ConstraintDescription: Must be a valid AWS IAM Role ARN.
    Description: AWS IAM Role ARN of the open-ci control plane permitted to assume this BYOC role.

  ExternalId:
    Type: String
    MinLength: 16
    MaxLength: 128
    NoEcho: true
    Description: High-entropy ExternalId generated by your open-ci onboarding wizard (prevents confused-deputy access).

  NamePrefix:
    Type: String
    Default: open-ci
    AllowedPattern: "^[a-z][a-z0-9-]{1,20}$"
    ConstraintDescription: Lowercase letters, digits, and hyphens only (2-21 chars, starting with a letter).
    Description: Prefix applied to the IAM role, security group, and optional S3 bucket.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where ephemeral open-ci Spot runners will launch.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: One or more subnets (ideally across 2+ AZs) with outbound internet access (IGW or NAT).

  CreateCacheBucket:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Set true to provision a private regional S3 bucket in your account for direct Actions cache storage.

  CacheRetentionDays:
    Type: Number
    Default: 14
    MinValue: 1
    MaxValue: 90
    Description: Lifecycle expiration in days for cached build artifacts (used when CreateCacheBucket is true).

Conditions:
  ShouldCreateCacheBucket: !Equals [!Ref CreateCacheBucket, "true"]

Resources:
  RunnerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${NamePrefix}-byoc-runners-egress-only"
      GroupDescription: Deny all inbound traffic; allow outbound CI egress only.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Outbound IPv4 CI egress
        - IpProtocol: "-1"
          CidrIpv6: "::/0"
          Description: Outbound IPv6 CI egress
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-byoc-runners-sg"
        - Key: open-ci-managed
          Value: "true"
        - Key: open-ci-role
          Value: byoc

  CacheBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateCacheBucket
    Properties:
      BucketName: !Sub "${NamePrefix}-cache-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-cache-objects
            Status: Enabled
            ExpirationInDays: !Ref CacheRetentionDays
      Tags:
        - Key: open-ci-managed
          Value: "true"
        - Key: open-ci-role
          Value: byoc

  ByocRunnerManagerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${NamePrefix}-byoc-runner-manager"
      Description: Cross-account BYOC role assumed by open-ci with ExternalId to launch zero-IAM ephemeral Spot runners.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowOpenCiControlPlaneWithExternalId
            Effect: Allow
            Principal:
              AWS: !Ref TrustedPrincipalArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: !Sub "${NamePrefix}-byoc-ec2-controller"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DescribeInventoryAndPreflight
                Effect: Allow
                Action:
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeImages
                  - ec2:DescribeInstances
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSpotPriceHistory
                  - ec2:DescribeSubnets
                  - ec2:DescribeVolumes
                  - servicequotas:GetServiceQuota
                Resource: "*"
              - Sid: LaunchTaggedRunnerInstancesWithImdsv2
                Effect: Allow
                Action: ec2:RunInstances
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    aws:RequestTag/open-ci-managed: "true"
                    ec2:MetadataHttpTokens: required
              - Sid: LaunchTaggedRunnerVolumes
                Effect: Allow
                Action: ec2:RunInstances
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*"
                Condition:
                  StringEquals:
                    aws:RequestTag/open-ci-managed: "true"
              - Sid: UseRunnerNetworkAndImage
                Effect: Allow
                Action: ec2:RunInstances
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/${RunnerSecurityGroup}"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}::image/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:image/*"
              - Sid: TagRunnersAtLaunchOnly
                Effect: Allow
                Action: ec2:CreateTags
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*"
                Condition:
                  StringEquals:
                    ec2:CreateAction: RunInstances
                    aws:RequestTag/open-ci-managed: "true"
              - Sid: TerminateOnlyOpenCiResources
                Effect: Allow
                Action:
                  - ec2:TerminateInstances
                  - ec2:DeleteVolume
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/open-ci-managed: "true"
              - !If
                - ShouldCreateCacheBucket
                - Sid: ScopedCacheBucketAccess
                  Effect: Allow
                  Action:
                    - s3:AbortMultipartUpload
                    - s3:DeleteObject
                    - s3:GetObject
                    - s3:ListBucket
                    - s3:PutObject
                  Resource:
                    - !GetAtt CacheBucket.Arn
                    - !Sub "${CacheBucket.Arn}/*"
                - !Ref AWS::NoValue
      Tags:
        - Key: open-ci-managed
          Value: "true"
        - Key: open-ci-role
          Value: byoc

Outputs:
  RoleArn:
    Description: Customer BYOC IAM Role ARN to paste into open-ci onboarding.
    Value: !GetAtt ByocRunnerManagerRole.Arn
  AccountId:
    Description: Customer AWS Account ID.
    Value: !Ref AWS::AccountId
  Region:
    Description: AWS Region for this BYOC connection.
    Value: !Ref AWS::Region
  SecurityGroupId:
    Description: Egress-only Security Group ID attached to ephemeral runners.
    Value: !Ref RunnerSecurityGroup
  SubnetIds:
    Description: Comma-separated Subnet IDs configured for ephemeral runners.
    Value: !Join [",", !Ref SubnetIds]
  CacheBucketName:
    Description: Optional S3 Cache Bucket name (empty if CreateCacheBucket is false).
    Value: !If [ShouldCreateCacheBucket, !Ref CacheBucket, ""]
  ConnectionBundleJson:
    Description: Paste this JSON into the open-ci BYOC onboarding wizard.
    Value: !Sub
      - '{"provider":"aws","account_id":"${AWS::AccountId}","region":"${AWS::Region}","role_arn":"${RoleArn}","security_group_id":"${SgId}","subnet_ids":"${Subnets}","cache_bucket":"${Bucket}"}'
      - RoleArn: !GetAtt ByocRunnerManagerRole.Arn
        SgId: !Ref RunnerSecurityGroup
        Subnets: !Join [",", !Ref SubnetIds]
        Bucket: !If [ShouldCreateCacheBucket, !Ref CacheBucket, ""]
