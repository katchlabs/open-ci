name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-binaries:
    name: Build Linux binaries (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    # glibc 2.34 floor: runs on Lambda provided.al2023, Debian 12 and Ubuntu 22.04+.
    container: amazonlinux:2023
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - name: Install native build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ make cmake perl pkgconf-pkg-config binutils git tar gzip zip

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-al2023-${{ matrix.target }}

      - name: Build open-ci and open-ci-aws-janitor
        run: |
          cargo build --release --locked \
            --target "${{ matrix.target }}" \
            --bin open-ci \
            --bin open-ci-aws-janitor

      - name: Enforce glibc 2.34 compatibility floor
        run: |
          for bin in open-ci open-ci-aws-janitor; do
            symbols="$(objdump -T "target/${{ matrix.target }}/release/${bin}")"
            if [[ "${symbols}" == *GLIBC_PRIVATE* ]]; then
              echo "::error::${bin} links GLIBC_PRIVATE symbols, which are not portable"
              exit 1
            fi
            required="$({ grep -Eo 'GLIBC_[0-9]+(\.[0-9]+)+' <<< "${symbols}" || true; } | sort -V -u | tail -1)"
            if [ -z "${required}" ]; then
              echo "::error::could not determine the glibc version ${bin} requires"
              exit 1
            fi
            echo "${bin} requires ${required}"
            if [ "$(sort -V <<< "${required}"$'\n'GLIBC_2.34 | tail -1)" != "GLIBC_2.34" ]; then
              echo "::error::${bin} requires ${required}; it would not start on AWS Lambda provided.al2023 or Debian 12"
              exit 1
            fi
          done

      - name: Package release archives and janitor Lambda zip
        run: |
          mkdir -p dist lambda
          tar -C "target/${{ matrix.target }}/release" -czf "dist/open-ci-${{ matrix.target }}.tar.gz" open-ci
          tar -C "target/${{ matrix.target }}/release" -czf "dist/open-ci-aws-janitor-${{ matrix.target }}.tar.gz" open-ci-aws-janitor
          install -m 0755 "target/${{ matrix.target }}/release/open-ci-aws-janitor" lambda/bootstrap
          (cd lambda && zip -X -q "../dist/open-ci-aws-janitor-lambda-${{ matrix.target }}.zip" bootstrap)

      - name: Upload target archives
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: dist
        run: |
          sha256sum *.tar.gz *.zip | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt

  container:
    name: Build & Publish Multi-Arch Container (GHCR)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract OCI metadata, tags, and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=open-ci
            org.opencontainers.image.description=Self-hosted ephemeral Spot GitHub Actions runner control plane
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push multi-arch container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
